name: Release Kernel

on:
  push:
    tags:
      - "kernel-v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  UPDATER_REPOSITORY: ${{ vars.UPDATER_REPOSITORY || 'psewdon1m/exocortex-updater' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: sigstore/cosign-installer@v3.10.1
      - uses: docker/setup-buildx-action@v3

      - name: Resolve version
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#kernel-v}"
          [[ "$GITHUB_REF_NAME" == "kernel-v${version}" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test and build
        shell: bash
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Download and verify pinned Updater
        env:
          GH_TOKEN: ${{ secrets.RELEASE_READ_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          updater_version="$(tr -d '[:space:]' < .release/updater.version)"
          mkdir -p .release-inputs
          gh release download "updater-v${updater_version}" \
            --repo "$UPDATER_REPOSITORY" --dir .release-inputs \
            --pattern "updater-${updater_version}-install.tar.gz" \
            --pattern "updater-${updater_version}-install.tar.gz.sha256" \
            --pattern "updater-${updater_version}-install.tar.gz.sigstore.json"
          (cd .release-inputs && sha256sum -c "updater-${updater_version}-install.tar.gz.sha256")
          cosign verify-blob \
            --bundle ".release-inputs/updater-${updater_version}-install.tar.gz.sigstore.json" \
            --certificate-identity "https://github.com/${UPDATER_REPOSITORY}/.github/workflows/release.yml@refs/tags/updater-v${updater_version}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ".release-inputs/updater-${updater_version}-install.tar.gz"
          tar -xzf ".release-inputs/updater-${updater_version}-install.tar.gz" -C .release-inputs

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and smoke-test image
        id: candidate
        shell: bash
        run: |
          image="release-candidate-kernel:${GITHUB_SHA}"
          docker buildx build --tag "$image" --load .
          docker run -d --name release-smoke-kernel \
            -e KERNEL_LISTEN_PORT=18180 \
            -e KERNEL_DATA_DIR=/tmp/kernel-data \
            -e KERNEL_ADMIN_USERNAME=release-operator \
            -e KERNEL_ADMIN_PASSWORD=release-test-password \
            -e KERNEL_SESSION_SECRET=release-test-session-secret-32-characters \
            -e KERNEL_SERVICE_TOKEN=release-test-token-24-characters \
            -e KERNEL_COOKIE_SECURE=false "$image"
          trap 'docker rm -f release-smoke-kernel >/dev/null 2>&1 || true' EXIT
          for _ in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' release-smoke-kernel)"
            [[ "$status" == healthy ]] && break
            [[ "$status" == unhealthy ]] && docker logs release-smoke-kernel && exit 1
            sleep 2
          done
          [[ "$(docker inspect --format '{{.State.Health.Status}}' release-smoke-kernel)" == healthy ]]

      - name: Publish immutable image
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --tag "${image}:${{ steps.release.outputs.version }}" \
            --tag "${image}:latest" --push --provenance=true --sbom=true \
            --metadata-file image-metadata.json .
          echo "reference=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(jq -r '.\"containerimage.digest\"' image-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          updater_version="$(tr -d '[:space:]' < .release/updater.version)"
          UPDATER_BUNDLE_DIR="$PWD/.release-inputs/updater" \
          UPDATER_BUNDLE_VERSION="$updater_version" \
            bash scripts/build-release.sh "${{ steps.release.outputs.version }}"

      - name: Sign artifacts
        shell: bash
        run: |
          find release-artifacts -maxdepth 1 -type f ! -name '*.sigstore.json' -print0 |
            while IFS= read -r -d '' artifact; do
              cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
            done
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "release-artifacts/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --verify-tag --latest=false --generate-notes \
            --title "Kernel ${{ steps.release.outputs.version }}"
