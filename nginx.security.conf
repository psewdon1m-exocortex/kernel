# Include this file inside Kernel's public HTTPS `server {}` block.
# The login page and authenticated UI/API are intentionally reachable from any
# client IP. Kernel remains the authentication and authorization boundary.
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;

# Reject common probe targets before they reach Node or the SPA fallback.
location ~ (^|/)\. {
    return 404;
}

location ~* \.(env|ini|log|sql|bak|backup|old|swp|zip|tar|gz)$ {
    return 404;
}

# Local health checks are available only through the loopback-bound application port.
location = /api/health {
    return 404;
}

location = /api/v1/health {
    return 404;
}

# Updater restore is a host-local callback, never a public API.
location = /api/internal/updater/restore {
    return 404;
}

# Documentation tooling must not become public if it is added later.
location = /docs { return 404; }
location ^~ /docs/ { return 404; }
location = /redoc { return 404; }
location = /openapi.json { return 404; }
location = /swagger { return 404; }
location ^~ /swagger/ { return 404; }
location = /api-docs { return 404; }
location ^~ /api-docs/ { return 404; }
