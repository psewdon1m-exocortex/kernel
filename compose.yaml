services:
  kernel:
    image: "${KERNEL_IMAGE:-kernel-kernel:latest}"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exocortex-kernel
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KERNEL_LISTEN_PORT:-18180}:${KERNEL_LISTEN_PORT:-18180}"
    environment:
      KERNEL_LISTEN_PORT: "${KERNEL_LISTEN_PORT:-18180}"
      KERNEL_DATA_DIR: /app/data
      KERNEL_ADMIN_USERNAME: "${KERNEL_ADMIN_USERNAME:?Set KERNEL_ADMIN_USERNAME in .env}"
      KERNEL_ADMIN_PASSWORD: "${KERNEL_ADMIN_PASSWORD:?Set KERNEL_ADMIN_PASSWORD in .env}"
      KERNEL_SESSION_SECRET: "${KERNEL_SESSION_SECRET:?Set KERNEL_SESSION_SECRET in .env}"
      KERNEL_SERVICE_TOKEN: "${KERNEL_SERVICE_TOKEN:?Set KERNEL_SERVICE_TOKEN in .env}"
      KERNEL_COOKIE_SECURE: "${KERNEL_COOKIE_SECURE:-false}"
      KERNEL_TRUST_PROXY: "${KERNEL_TRUST_PROXY:-false}"
      KERNEL_DISK_PATH: /
      KERNEL_VERSION: "${KERNEL_VERSION:-0.2.0}"
      KERNEL_AUDIT_MAX_ENTRIES: "${KERNEL_AUDIT_MAX_ENTRIES:-10000}"
      KERNEL_AUDIT_RETENTION_DAYS: "${KERNEL_AUDIT_RETENTION_DAYS:-30}"
      KERNEL_AUDIT_MAX_BYTES: "${KERNEL_AUDIT_MAX_BYTES:-67108864}"
      KERNEL_UPDATE_CHECK_TIMEOUT_MS: "${KERNEL_UPDATE_CHECK_TIMEOUT_MS:-5000}"
      UPDATER_SOCKET_PATH: /run/exocortex/updater.sock
      UPDATER_HEAD_ID: "${UPDATER_HEAD_ID:-kernel}"
      UPDATER_CONTROL_TOKEN: "${UPDATER_CONTROL_TOKEN:?Set UPDATER_CONTROL_TOKEN in .env}"
    volumes:
      - kernel-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  kernel-data:
